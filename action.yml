name: 'Claude Code run'
description: >
  Run Claude Code through one pinned copy of anthropics/claude-code-action, so an upgrade is one edit rather than one per call site.

inputs:
  prompt:
    description: The prompt to send to Claude Code.
    required: true
  claude-args:
    description: >
      Arguments passed straight to the Claude CLI — model, tool allowlist, --json-schema, and the "--resume <id>" that claude-code-session hands back.
    required: false
    default: ''
  anthropic-api-key:
    description: >
      Anthropic API key. A composite action cannot read the caller's secrets, so this is passed in rather than defaulted.
    required: true
  github-token:
    description: Token the agent uses for git and gh; usually a GitHub App token minted by the calling job.
    required: true
  allowed-bots:
    description: >
      Comma-separated bot logins whose comments may reach the agent, or "*" for all. Empty — the default, and upstream's — allows none.
    required: false
    default: ''
  show-full-output:
    description: >
      Log Claude's full JSON output. It contains every tool result, so only turn it on where those cannot carry a secret.
    required: false
    default: 'false'

outputs:
  session-id:
    description: The session this run wrote, for `--resume` or for claude-code-session to save.
    value: ${{ steps.agent.outputs.session_id }}
  structured-output:
    description: The JSON the agent returned when `--json-schema` was in claude-args.
    value: ${{ steps.agent.outputs.structured_output }}
  execution-file:
    description: Path to the execution log, for uploading as a trace artifact.
    value: ${{ steps.agent.outputs.execution_file }}
  branch-name:
    description: The branch the agent worked on, when it created one.
    value: ${{ steps.agent.outputs.branch_name }}

# Deliberately one step. The wrapper owns the pin and the input names; it does
# not own the caller's job, and adding steps here would make it a second
# implementation of one.
runs:
  using: composite
  steps:
    - name: Run Claude Code
      id: agent
      uses: anthropics/claude-code-action@e0cf66d1d257526b5d07f141838c338921cb8455 # v1.0.182
      with:
        prompt: ${{ inputs.prompt }}
        claude_args: ${{ inputs.claude-args }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        show_full_output: ${{ inputs.show-full-output }}

branding:
  icon: play-circle
  color: orange
